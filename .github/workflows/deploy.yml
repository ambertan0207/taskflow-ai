name: Publish TaskFlow AI to GitHub Pages

on:
  push:
    branches: ["single-html-review"]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate standalone HTML and inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('site/index.html', 'utf8');
          if (!/^<!doctype html>/i.test(html.trim())) throw new Error('Missing HTML doctype');
          if (!/<style[\\s>]/i.test(html) || !/<script[\\s>]/i.test(html)) throw new Error('Expected embedded CSS and JavaScript');
          if (/<script[^>]+src=/i.test(html)) throw new Error('External script source found');
          if (!html.includes('id="quickJotForm"') || !html.includes('id="quickJotInput"')) throw new Error('Overview quick jot is missing');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(m => m[1]).filter(s => s.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found');
          scripts.forEach((script, i) => new vm.Script(script, { filename: `inline-script-${i + 1}.js` }));
          console.log(`Validated standalone HTML (${Buffer.byteLength(html)} bytes), ${scripts.length} inline script(s).`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
